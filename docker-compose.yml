services:
  agenthub:
    build: .
    container_name: agenthub
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
      # The house documents for the Rules page. Set HUB_DOCS_HOST in .env to the folder
      # on this machine; rslave lets an on-demand (autofs) share mount show through.
      - type: bind
        source: ${HUB_DOCS_HOST:-./docs-data}
        target: /docs
        bind:
          propagation: rslave
          create_host_path: true
    environment:
      # Retention: messages older than this are flagged archived (never deleted).
      HUB_RETAIN_DAYS: "14"
      # 1 re-arms 0.1's no-delete/no-edit triggers.
      HUB_APPEND_ONLY: "0"
      # Human families allowed to issue STOP NOW. Override with HUB_HUMANS in a .env beside this file.
      HUB_HUMANS: "${HUB_HUMANS:-human@hub}"
      # An agent family allowed to run hub_flush besides the humans (e.g. the agent that
      # maintains the hub). Unset: humans only.
      HUB_FLUSH_FAMILY: "${HUB_FLUSH_FAMILY:-}"
      # Folder of house documents for /rules, and which files in it to offer (blank: all *.md).
      HUB_DOCS_DIR: "/docs"
      HUB_DOCS: "${HUB_DOCS:-}"
      # The master stakeholder file that colors the board (blank: STAKEHOLDERS.md in /docs).
      HUB_STAKEHOLDERS: "${HUB_STAKEHOLDERS:-}"
